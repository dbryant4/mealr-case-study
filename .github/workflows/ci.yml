name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Runs before any install: needs no toolchain, so a bad version fails
      # in seconds instead of after a full dependency download.
      - name: VERSION is semver
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION '$v' is not X.Y.Z - see .cursor/rules/semver-version.mdc"
            exit 1
          fi
          echo "version $v"

      # This repo ships documentation and one static SVG, so there is nothing to
      # build or test. The VERSION gate is kept because the release tooling depends
      # on that file across all 14 repos, and it costs seconds. An earlier SVG
      # well-formedness step was dropped: it guarded a single file that already
      # parses and effectively never changes.
